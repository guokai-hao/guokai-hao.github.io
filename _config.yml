title: "你的名字"
description: "Ph.D. Student | Reinforcement Learning"
url: "https://guokai-hao.github.io"
baseurl: ""
lang: "en"

# 替换成你自己的头像文件；默认提供 profile-placeholder.png
avatar: /profile-placeholder.png

# 学术主页采用白色侧边栏，不再使用博客背景图
cover_bg_color: "#ffffff"
cover_color: "#444444"

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - README_CN.md
  - scripts/
  - not-pure-poole.gemspec

twitter:
  card: summary

social:
  name: "你的名字"
  links:
    - https://github.com/guokai-hao

sass:
  sass_dir: _sass
  style: :compressed

author:
  name: "你的名字"
  url: "https://guokai-hao.github.io"
  email: "your-email@example.com"
